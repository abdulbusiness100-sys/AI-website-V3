<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SPIDXR - Your Personal Urban Concierge Service" />
    <title>SPIDXR | Simplify Life. Amplify Time.</title>
    <!-- The SPIDXR app icon: the gold tile with black eyes. The black tile is for dark mode only. -->
    <!-- favicon.ico holds 16, 32 and 48 px; sizes="32x32" keeps browsers that read SVG on the SVG below. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <!-- One SVG for both modes: it turns into the black tile itself under prefers-color-scheme: dark. A media
         attribute on <link rel="icon"> isn't honoured everywhere, and a browser that ignores it could show the
         black tile in light mode. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The tab icons have transparent rounded corners. The touch icon stays a full square on purpose: iOS rounds
         it itself, and transparent corners would turn black on the home screen. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Link previews (iMessage, WhatsApp, Slack, X), including invite links /r/<CODE>. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SPIDXR" />
    <meta property="og:title" content="SPIDXR | Simplify Life. Amplify Time." />
    <meta property="og:description" content="SPIDXR - Your Personal Urban Concierge Service" />
    <meta property="og:image" content="https://www.spidxr.co.uk/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SPIDXR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.spidxr.co.uk/og-image.jpg" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
