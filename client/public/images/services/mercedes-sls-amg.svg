<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="carBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0E0E0" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D0D0D0" />
    </linearGradient>
    <linearGradient id="road" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#333333" />
      <stop offset="100%" stop-color="#111111" />
    </linearGradient>
    <linearGradient id="window" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7BC4E5" />
      <stop offset="100%" stop-color="#3A8CB9" />
    </linearGradient>
    <radialGradient id="wheel" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#333333" />
      <stop offset="100%" stop-color="#111111" />
    </radialGradient>
    <linearGradient id="light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFCED" />
      <stop offset="100%" stop-color="#FFB84D" />
    </linearGradient>
  </defs>

  <!-- Sky background -->
  <rect width="600" height="400" fill="#061429" />
  
  <!-- Stars in sky -->
  <g id="stars">
    <circle cx="50" cy="50" r="1" fill="white" opacity="0.8" />
    <circle cx="150" cy="70" r="1.2" fill="white" opacity="0.7" />
    <circle cx="250" cy="40" r="0.8" fill="white" opacity="0.9" />
    <circle cx="350" cy="60" r="1" fill="white" opacity="0.8" />
    <circle cx="450" cy="30" r="1.2" fill="white" opacity="0.7" />
    <circle cx="550" cy="80" r="0.8" fill="white" opacity="0.9" />
    
    <circle cx="100" cy="30" r="1" fill="white" opacity="0.8" />
    <circle cx="200" cy="90" r="1.2" fill="white" opacity="0.7" />
    <circle cx="300" cy="20" r="0.8" fill="white" opacity="0.9" />
    <circle cx="400" cy="50" r="1" fill="white" opacity="0.8" />
    <circle cx="500" cy="70" r="1.2" fill="white" opacity="0.7" />
    
    <circle cx="75" cy="100" r="0.8" fill="white" opacity="0.9" />
    <circle cx="175" cy="25" r="1" fill="white" opacity="0.8" />
    <circle cx="275" cy="85" r="1.2" fill="white" opacity="0.7" />
    <circle cx="375" cy="35" r="0.8" fill="white" opacity="0.9" />
    <circle cx="475" cy="120" r="1" fill="white" opacity="0.8" />
  </g>

  <!-- Road -->
  <rect x="0" y="300" width="600" height="100" fill="url(#road)" />
  <rect x="0" y="340" width="600" height="5" fill="white" opacity="0.1" />
  
  <!-- Road lane markers -->
  <rect x="50" y="347" width="40" height="3" fill="white" />
  <rect x="150" y="347" width="40" height="3" fill="white" />
  <rect x="250" y="347" width="40" height="3" fill="white" />
  <rect x="350" y="347" width="40" height="3" fill="white" />
  <rect x="450" y="347" width="40" height="3" fill="white" />
  <rect x="550" y="347" width="40" height="3" fill="white" />
  
  <!-- Car shadow -->
  <ellipse cx="300" cy="340" rx="180" ry="15" fill="black" opacity="0.6" />
  
  <!-- Car body -->
  <path d="M150,290 C170,260 250,250 300,250 C350,250 430,260 450,290 C460,300 460,310 450,320 C430,330 350,340 300,340 C250,340 170,330 150,320 C140,310 140,300 150,290 Z" fill="url(#carBody)" />
  
  <!-- Car roof/windows -->
  <path d="M200,280 C240,260 340,260 400,280 C420,290 420,300 400,310 C340,330 240,330 200,310 C180,300 180,290 200,280 Z" fill="url(#window)" />
  
  <!-- Car details -->
  <!-- Front grille -->
  <path d="M150,290 C160,295 170,300 180,300 L180,310 C170,310 160,305 150,300 Z" fill="#333333" />
  <rect x="160" y="295" width="15" height="10" rx="2" fill="#111111" />
  
  <!-- Mercedes logo -->
  <circle cx="170" cy="300" r="5" fill="#DDDDDD" stroke="#999999" stroke-width="1" />
  <path d="M170,295 L173,300 L170,305 L167,300 Z" fill="none" stroke="#999999" stroke-width="1" />
  
  <!-- Headlights -->
  <ellipse cx="155" cy="290" rx="5" ry="3" fill="url(#light)" />
  <ellipse cx="155" cy="300" rx="5" ry="3" fill="url(#light)" />
  
  <!-- Taillights -->
  <ellipse cx="445" cy="290" rx="5" ry="3" fill="#FF3333" />
  <ellipse cx="445" cy="300" rx="5" ry="3" fill="#FF3333" />
  
  <!-- Wheels -->
  <circle cx="200" cy="320" r="20" fill="url(#wheel)" stroke="#666666" stroke-width="2" />
  <circle cx="200" cy="320" r="10" fill="#333333" stroke="#999999" stroke-width="1" />
  <circle cx="200" cy="320" r="2" fill="#CCCCCC" />
  
  <circle cx="400" cy="320" r="20" fill="url(#wheel)" stroke="#666666" stroke-width="2" />
  <circle cx="400" cy="320" r="10" fill="#333333" stroke="#999999" stroke-width="1" />
  <circle cx="400" cy="320" r="2" fill="#CCCCCC" />
  
  <!-- Wheel spokes -->
  <line x1="190" y1="320" x2="210" y2="320" stroke="#999999" stroke-width="1" />
  <line x1="200" y1="310" x2="200" y2="330" stroke="#999999" stroke-width="1" />
  <line x1="193" y1="313" x2="207" y2="327" stroke="#999999" stroke-width="1" />
  <line x1="207" y1="313" x2="193" y2="327" stroke="#999999" stroke-width="1" />
  
  <line x1="390" y1="320" x2="410" y2="320" stroke="#999999" stroke-width="1" />
  <line x1="400" y1="310" x2="400" y2="330" stroke="#999999" stroke-width="1" />
  <line x1="393" y1="313" x2="407" y2="327" stroke="#999999" stroke-width="1" />
  <line x1="407" y1="313" x2="393" y2="327" stroke="#999999" stroke-width="1" />
  
  <!-- Door lines -->
  <path d="M250,270 C270,265 290,265 310,270 L320,320 C300,325 280,325 260,320 Z" fill="none" stroke="#BBBBBB" stroke-width="0.5" />
  
  <!-- Reflection highlights -->
  <path d="M180,270 C240,255 340,255 420,270" fill="none" stroke="white" stroke-width="1" opacity="0.3" />
  <path d="M180,280 C240,265 340,265 420,280" fill="none" stroke="white" stroke-width="1" opacity="0.2" />
  
  <!-- Text label at bottom -->
  <text x="300" y="380" text-anchor="middle" font-family="serif" font-size="14" fill="#C3B091" font-style="italic">SPIDXR Premium Transport Services</text>
</svg>